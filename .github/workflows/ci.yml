name: foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore PlcMcpPlatform.sln --locked-mode
      - run: dotnet build PlcMcpPlatform.sln -c Release --no-restore
      - run: dotnet test PlcMcpPlatform.sln -c Release --no-build --no-restore
      - run: python eng/capability-inventory.py
      - run: python eng/verify-mcp.py
      - run: python eng/verify-execution.py
      - run: python eng/verify-editing.py
      - run: python eng/verify-configuration.py
      - run: python eng/verify-exchange.py
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: '22'
      - name: Install pinned OpenCode CLI for connection regression
        if: runner.os == 'Linux'
        run: npm install --prefix "$RUNNER_TEMP/plc-opencode" --no-save --package-lock=false opencode-ai@1.19.5
      - run: python eng/verify-delivery.py
        env:
          PLCMCP_OPENCODE: ${{ runner.os == 'Linux' && format('{0}/plc-opencode/node_modules/.bin/opencode', runner.temp) || '' }}
      - run: python eng/verify-incremental.py
      - run: python eng/verify-members.py
      - run: python eng/verify-graphs.py
      - run: python eng/verify-initializers.py
      - run: python eng/verify-maintenance.py
      - run: python eng/verify-publish.py
      - run: python -m unittest discover -s tests/script_engine -v
      - name: Package P11 versioned prerelease modes
        if: runner.os == 'Windows'
        run: python eng/package-release.py --output artifacts/prerelease
      - name: Upload immutable prerelease bundles
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: PlcMcpPlatform-P11-windows-bundles
          path: artifacts/prerelease/*
          if-no-files-found: error
          retention-days: 30
  prerelease:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: versioned-prerelease
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PlcMcpPlatform-P11-windows-bundles
          path: artifacts/prerelease
      - name: Verify and publish immutable candidate version
        run: python eng/publish-github-release.py --directory artifacts/prerelease --target "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" --publish
        env:
          GH_TOKEN: ${{ github.token }}
